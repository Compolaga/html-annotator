  /* Concept-berichtkaart: een nog niet verstuurd bericht, zo weergegeven dat Luc

  .la-draft { background: #fffdf7; border: 1px solid #e8dcc0; border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }

  /* Tracked changes op een conceptbericht: Luc herschrijft de tekst zelf en het

  /* Geneste subpunten: elk niveau springt een stap verder in en krijgt een haakje
     naar zijn ouder, zodat een lijst met subtaken op het oog te lezen is. Zie
     SKILL.md deel 7. Hangt bewust aan niets anders dan de eigen klasse — geen
     .card of andere pagina-klasse — zodat het op elk blok-element werkt (kaart,
     li, div). De lijnkleur volgt --line als de pagina die definieert, met een
     lichte fallback zodat het haakje ook zonder tokens zichtbaar is. */
  .la-sub, .la-sub2, .la-sub3, .la-sub4 {
    --la-diepte: 1;
    position: relative;
    margin-left: calc(var(--la-diepte) * var(--la-stap, 30px));
  }
  .la-sub2 { --la-diepte: 2 }
  .la-sub3 { --la-diepte: 3 }
  .la-sub4 { --la-diepte: 4 }
  .la-sub::before, .la-sub2::before, .la-sub3::before, .la-sub4::before {
    content: ""; position: absolute;
    left: calc(-0.53 * var(--la-stap, 30px));
    width: calc(0.47 * var(--la-stap, 30px));
    top: -10px; bottom: 50%;
    border-left: 2px solid var(--line, #d8d8d2);
    border-bottom: 2px solid var(--line, #d8d8d2);
    border-bottom-left-radius: 8px;
  }
</style>
<script>
(function () {
  "use strict";
  var BRIDGE = "http://127.0.0.1:8791";
  var KEY = "luc-annotaties:" + location.pathname;
  var anns = [];
  try { anns = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
  var teller = anns.reduce(function (m, a) { return Math.max(m, a.nr || 0); }, 0);
  var brug = { ok: false, jsonPath: null, count: 0, round: null };

  function bewaarLokaal() { try { localStorage.setItem(KEY, JSON.stringify(anns)); } catch (e) {} }
  function el(tag, css, ouder) { var d = document.createElement(tag); if (css) d.style.cssText = css; (ouder || document.body).appendChild(d); return d; }
  function slug() { return (document.title || location.pathname).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "pagina"; }
  function paginaBestand() {
    if (location.protocol === "file:") {
      try { return decodeURIComponent(location.pathname); } catch (e) { return location.pathname; }
    }
    /* via de bridge geserveerd: http://127.0.0.1:8791/p/<pad-vanaf-home> */
    var m = location.pathname.match(/^\/p\/(.+)$/);
    if (m && (location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
      try { return "~/" + decodeURIComponent(m[1]); } catch (e) { return "~/" + m[1]; }
    }
    return null;
  }
  function domHash() {
    var h = 5381, s = document.body ? document.body.innerText || "" : "";
    for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
    return (h >>> 0).toString(16);
  }
  /* eenmalig, vóór de annotator zelf iets in de DOM zet: anders veranderen
     badges en de statuspil de hash en denkt de bridge dat het een nieuwe ronde is */
  var DOMHASH = domHash();
  function basis() {
    return {
      page: location.href, pageFile: paginaBestand(), slug: slug(), title: document.title,
      domHash: DOMHASH,
      doc: { w: document.documentElement.scrollWidth, h: document.documentElement.scrollHeight }
    };
  }

  /* ---- bridge-communicatie -------------------------------------- */
  function post(pad, body) {
    return fetch(BRIDGE + pad, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || "bridge-fout");
      return j;
    });
  }
  function zetStatus(aan, tekst, titel) {
    var s = document.getElementById("la-status");
    if (!s) return;
    s.classList.toggle("la-uit", !aan);
    s.textContent = tekst;
    s.title = titel || "";
  }
  /* De bridge is leidend zodra hij bereikbaar is: hij levert de open (niet-resolved)
     annotaties van de lopende ronde, en die vervangen de lokale lijst. Zo verdwijnen
     verwerkte annotaties na een refresh en blijven de rest gewoon staan. Zonder
     bridge blijft localStorage het vangnet. */
  function uitBridge(j) {
    if (!j || !Array.isArray(j.annotations)) return;
    anns = j.annotations.map(function (a) {
      return {
        id: a.id, nr: a.nr, type: a.type || "region",
        rect: a.rect || null, comment: a.comment || "", target: a.target || "",
        selectedText: a.selectedText || "", refs: a.refs || null,
        commentExpanded: a.commentExpanded || "", refsIncomplete: a.refsIncomplete || null,
        img: null,
        veld: a.veld || "", origineel: a.origineel || "", nieuw: a.nieuw || "",
        diff: a.diff || [], hunks: a.hunks || [],
        createdAt: a.createdAt, stale: !!a.stale
      };
    });
    teller = Math.max(j.maxNr || 0, anns.reduce(function (m, a) { return Math.max(m, a.nr || 0); }, 0));
    bewaarLokaal(); render();
  }

  function verversSessie() {
    return post("/session", basis()).then(function (j) {
      /* Nieuwe ronde op schijf? Dan horen de badges van de vorige ronde hier niet
         meer thuis: die staan al veilig in hun eigen rondemap. Lokaal opschonen,
         anders blijven oude markeringen op verschoven posities hangen. */
      var vorige = null;
      try { vorige = JSON.parse(localStorage.getItem(KEY + ":ronde") || "null"); } catch (e) {}
      if (vorige !== null && vorige !== j.round) {
        anns = []; teller = 0;
        try { localStorage.setItem(KEY, "[]"); } catch (e) {}
        render();
      }
      try { localStorage.setItem(KEY + ":ronde", JSON.stringify(j.round)); } catch (e) {}
      uitBridge(j);
      brug.ok = true; brug.jsonPath = j.jsonPath; brug.count = j.count; brug.round = j.round;
      zetStatus(true, j.count + " saved", j.jsonPath);
      return j;
    }).catch(function () {
      brug.ok = false; brug.jsonPath = null;
      zetStatus(false, "bridge off - localStorage only",
        "Start the bridge: python3 ~/.claude/skills/html-annotator/annotator-bridge.py");
      return null;
    });
  }

  /* ---- knoppenbalk ---------------------------------------------- */
  /* Region = macOS Screenshot dashed frame. Text = I-beam + selection chunk. */
  var icoRegio = '<svg class="la-ico" viewBox="0 0 16 16" aria-hidden="true">' +
    '<rect x="2.2" y="2.2" width="11.6" height="11.6" rx="1.6" ry="1.6" fill="none" ' +
      'stroke="currentColor" stroke-width="1.35" stroke-linecap="butt" ' +
      'stroke-dasharray="2.35 1.65"/></svg>';
  var icoTekst = '<svg class="la-ico" viewBox="0 0 16 16" aria-hidden="true">' +
    '<path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" ' +
      'd="M2.75 2.5h4.5M5 2.5v11M2.75 13.5h4.5"/>' +
    '<rect x="9" y="4.75" width="5" height="2.4" rx="0.4" fill="currentColor" opacity=".32"/>' +
    '<rect x="9" y="8.35" width="3.7" height="2.4" rx="0.4" fill="currentColor" opacity=".18"/></svg>';
  var bar = document.createElement("div"); bar.id = "la-bar";
  bar.innerHTML = '<span id="la-status">checking bridge...</span>' +
    '<button id="la-toggle">' + icoRegio + 'Annotate selection</button>';
  document.body.appendChild(bar);

  /* ---- anker terugvinden na een pagina-wijziging ------------------ */
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  /* Zoekt de opgeslagen selectie terug in de huidige DOM en geeft de nieuwe
     paginacoördinaten. Zo blijven tekstannotaties kloppen als er tekst boven is
     bijgekomen of weggevallen. Niet gevonden? Dan is de annotatie een "wees". */
  function zoekTekst(needle) {
    var doel = (needle || "").replace(/\s+/g, " ").trim().slice(0, 300);
    if (doel.length < 3) return null;

    /* Alle zichtbare tekstnodes achter elkaar in één string, met een index terug
       naar (node, offset). Dat is nodig om twee redenen:
       - een selectie kan over meerdere nodes lopen zodra er opmaak in staat
         (<b>, <a>, <code>), en per node zoeken vindt zo'n zin nooit;
       - bij text-transform: uppercase levert de selectie HOOFDLETTERS op terwijl
         de DOM de originele schrijfwijze bevat, dus matchen we hoofdletter-
         ongevoelig. */
    var nodes = [], stukken = [], lengte = 0, n;
    var loper = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function (k) {
        if (!k.nodeValue) return NodeFilter.FILTER_REJECT;
        var p = k.parentElement;
        if (!p || p.closest("#la-bar,#la-popup,#la-wees,#la-sesmeld,script,style,noscript")) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    while ((n = loper.nextNode())) {
      nodes.push({ node: n, start: lengte, lengte: n.nodeValue.length });
      stukken.push(n.nodeValue);
      lengte += n.nodeValue.length;
    }
    if (!nodes.length) return null;
    var hooi = stukken.join("");

    var re;
    try {
      re = new RegExp(doel.split(/\s+/).map(escRe).join("\\s+"), "i");
    } catch (e) { return null; }
    var m = re.exec(hooi);
    if (!m) return null;

    function plek(pos) {
      for (var i = 0; i < nodes.length; i++) {
        var e = nodes[i];
        if (pos >= e.start && pos <= e.start + e.lengte) {
          return { node: e.node, offset: pos - e.start };

    var van = plek(m.index), tot = plek(m.index + m[0].length);
    if (!van || !tot) return null;

      r.setEnd(tot.node, tot.offset);
      var b = r.getBoundingClientRect();
      if (!b.width && !b.height) return null;
      return { x: Math.round(b.left + scrollX), y: Math.round(b.top + scrollY),
               w: Math.round(b.width), h: Math.round(b.height) };
    } catch (e) { return null; }
  }

  /* ---- tekenen --------------------------------------------------- */
  /* Een annotatie verliest haar anker precies doordat de tekst is aangepast: dat
     is eerder het signaal dat ze verwerkt IS dan een foutmelding. Daarom staat het
     kaartje er als "waarschijnlijk verwerkt, afvinken?" met per regel een vinkje,
     en niet als alarm. Standaard ingeklapt (stand in localStorage). */
  var WEESKEY = KEY + ":wees-open";

  }

    var oud = document.getElementById("la-wees"); if (oud) oud.remove();
    if (!lijst.length) return;

    if (weesOpen()) box.classList.add("la-open");

      '<span class="la-chev" aria-hidden="true">' +

          'stroke-linecap="round" stroke-linejoin="round" d="M4 2.5L8 6l-4 3.5"/></svg>' +
      '</span><span class="la-wees-tel"></span>';

      lijst.length + " likely processed";

    kop.addEventListener("click", function (ev) {

    var lijstEl = document.createElement("div"); lijstEl.className = "la-wees-lijst";
    var icoCheck = '<svg viewBox="0 0 12 12" aria-hidden="true">' +
      '<path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" ' +
        'stroke-linejoin="round" d="M2.5 6.2L5 8.7l4.5-5.2"/></svg>';
    lijst.forEach(function (a) {
      var rij = document.createElement("div"); rij.className = "la-wees-rij";
      var b = document.createElement("button"); b.className = "la-wees-tekst";
      b.textContent = "#" + a.nr + " · " + ((a.comment || a.selectedText || a.target || "").slice(0, 70) || "(no text)");
      b.addEventListener("click", function (ev) { ev.stopPropagation(); openPopup(a); });

    document.body.appendChild(box);
    mijdKnoppenbalk(box);
  }
  /* De knoppenbalk rechtsonder is breed en groeit mee met zijn tekst; op een smal
     venster botst het kaartje ertegenaan. Meten en het kaartje er dan boven zetten. */
  function mijdKnoppenbalk(box) {
    box = box || document.getElementById("la-wees");
    var bar = document.getElementById("la-bar");
    if (!box || !bar) return;
    box.style.bottom = "12px";
    var b = box.getBoundingClientRect(), k = bar.getBoundingClientRect();
    if (b.right > k.left && b.bottom > k.top) {
      box.style.bottom = Math.round(innerHeight - k.top + 8) + "px";
    }
  }
  addEventListener("resize", function () { mijdKnoppenbalk(); });

  /* Badges hangen aan gemeten posities, dus ze moeten mee zodra de layout
     verschuift. Dat gebeurt bij het laden van fonts en afbeeldingen, bij een
     resize, en vooral zodra een <details> open- of dichtklapt: alles eronder
     schuift dan, en zonder hertekenen wijzen de badges naar het verkeerde stuk
     of lijken ze zelfs kwijt. */
  var hertekenTimer = null, bezigMetTekenen = false;
  function herteken() {
    if (bezigMetTekenen) return;
    clearTimeout(hertekenTimer);
    hertekenTimer = setTimeout(function () {
      bezigMetTekenen = true;
      try { render(); } finally {
        setTimeout(function () { bezigMetTekenen = false; }, 0);
      }

  }
  addEventListener("load", herteken);
  addEventListener("resize", herteken);
  /* toggle bubbelt niet, dus in de capture-fase meeluisteren */
  document.addEventListener("toggle", function (ev) {

  }, true);

  }

  function render() {
    document.querySelectorAll(".la-badge,.la-rect").forEach(function (n) { n.remove(); });

      var rect = a.rect;
      /* Bewerkingen van een conceptbericht hebben geen plek op de pagina: ze zijn al
         zichtbaar in de kaart zelf, als doorhaling en onderstreping. Een badge zou
         nergens op slaan, en zonder rechthoek zouden ze in de weeslijst belanden en
         daar als "waarschijnlijk verwerkt" gaan staan terwijl er niets aan de hand is. */
      if (a.type === "edit") { return; }
      /* tekstannotaties: anker opnieuw opzoeken op basis van de selectie zelf */
      if (a.type === "text" && a.selectedText) {
        var nieuw = zoekTekst(a.selectedText);
        if (nieuw) { a.rect = rect = nieuw; }
        else { wezen.push(a); return; }
      } else if (a.stale) {

        wezen.push(a); return;

      b.title = a.comment || "";

  }

  /* ---- popup + tekst-referenties --------------------------------- */
  var popup = null, hangendeGhost = null, refPickMode = false, refPickInsert = null;
  var refInsertRange = null, refSelListener = null;
  function ruimGhostOp() { if (hangendeGhost) { hangendeGhost.remove(); hangendeGhost = null; } }
  function sluitPopup() {
    refPickMode = false; refPickInsert = null; refInsertRange = null;
    if (refSelListener) {
      document.removeEventListener("selectionchange", refSelListener);
      refSelListener = null;
    }
    if (popup) { popup.remove(); popup = null; }
    ruimGhostOp();
  }
  function laRefLabel(t) {
    t = (t || "").replace(/\s+/g, " ").trim();
    return t.length > 36 ? t.slice(0, 34) + "\u2026" : t;
  }
  function laRefTeller(refs) {
    var m = 0;
    (refs || []).forEach(function (r) {
      var n = parseInt(String(r.id || "").replace(/^r/, ""), 10);
      if (!isNaN(n)) m = Math.max(m, n);
    });
    return m;
  }
  function laMaakRefChip(id, tekst) {
    var chip = document.createElement("span");
    chip.className = "la-ref";
    chip.contentEditable = "false";
    chip.dataset.refId = id;
    chip.dataset.refText = tekst;
    chip.title = tekst;
    var lbl = document.createElement("span");
    lbl.className = "la-ref-t";
    lbl.textContent = laRefLabel(tekst);
    chip.appendChild(lbl);
    var x = document.createElement("button");
    x.type = "button";
    x.className = "la-ref-x";
    x.textContent = "\u00d7";
    x.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
    x.addEventListener("click", function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      chip.remove();
    });
    chip.appendChild(x);
    return chip;
  }
  function laCommentLees(ed) {
    var comment = "", refs = [], seen = {};
    function walk(node, blockBreak) {
      if (node.nodeType === 3) {
        comment += node.textContent.replace(/\u200B/g, "");
        return;
      }
      if (node.nodeType !== 1) return;
      var el = node;
      if (el.classList && el.classList.contains("la-ref")) {
        var id = el.dataset.refId || "";
        var tekst = el.dataset.refText || el.title || "";
        comment += "\u27e6" + id + "\u27e7";
        if (id && !seen[id]) {
          seen[id] = true;
          refs.push({ id: id, selectedText: tekst });
        }
        return;
      }
      if (el.tagName === "BR") { comment += "\n"; return; }
      var kids = el.childNodes;
      for (var i = 0; i < kids.length; i++) walk(kids[i], false);
      if (blockBreak && el !== ed && (el.tagName === "DIV" || el.tagName === "P")) comment += "\n";
    }
    var nodes = ed.childNodes;
    for (var j = 0; j < nodes.length; j++) {
      walk(nodes[j], true);
      if (nodes[j].nodeType === 1 && (nodes[j].tagName === "DIV" || nodes[j].tagName === "P") && j < nodes.length - 1) {
        comment += "\n";
      }

    return { comment: comment.replace(/\n+$/, "").trim(), refs: refs };
  }
  function laCommentZet(ed, comment, refs) {
    ed.innerHTML = "";
    refs = refs || [];
    var byId = {};
    refs.forEach(function (r) { if (r.id) byId[r.id] = r; });
    var txt = comment || "", re = /\u27e6([^\u27e7]+)\u27e7/g, last = 0, m;
    while ((m = re.exec(txt))) {
      if (m.index > last) ed.appendChild(document.createTextNode(txt.slice(last, m.index)));
      var ref = byId[m[1]];
      if (ref && ref.selectedText) ed.appendChild(laMaakRefChip(m[1], ref.selectedText));
      else ed.appendChild(document.createTextNode(m[0]));
      last = m.index + m[0].length;
    }
    if (last < txt.length) ed.appendChild(document.createTextNode(txt.slice(last)));
  }
  function laRefCursorBewaar(ed) {
    var sel = window.getSelection();
    if (sel.rangeCount && ed.contains(sel.anchorNode)) {
      refInsertRange = sel.getRangeAt(0).cloneRange();
      return;
    }
    if (!refInsertRange || !ed.contains(refInsertRange.startContainer)) {
      refInsertRange = document.createRange();
      refInsertRange.selectNodeContents(ed);
      refInsertRange.collapse(false);
    }
  }
  function laInsertAtRefCursor(ed, node) {
    var range;
    if (refInsertRange && ed.contains(refInsertRange.startContainer)) {
      range = refInsertRange.cloneRange();
    } else {
      range = document.createRange();
      range.selectNodeContents(ed);
      range.collapse(false);
    }
    range.deleteContents();
    range.insertNode(node);
    var sp = document.createTextNode("\u200B");
    range.setStartAfter(node);
    range.insertNode(sp);
    range.setStart(sp, 1);
    range.collapse(true);

    sel.removeAllRanges();

  }
  function laValideerRefs(parsed) {
    var ids = {}, re = /\u27e6([^\u27e7]+)\u27e7/g, m;
    while ((m = re.exec(parsed.comment || ""))) ids[m[1]] = true;
    var refIds = {};
    (parsed.refs || []).forEach(function (r) { if (r.id) refIds[r.id] = true; });
    var miss = [];
    Object.keys(ids).forEach(function (id) { if (!refIds[id]) miss.push(id); });
    return miss;
  }
  function paginaSelectie() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    var tekst = sel.toString().replace(/\s+/g, " ").trim();
    if (tekst.length < 2) return null;
    var node = sel.anchorNode;
    var host = node && (node.nodeType === 1 ? node : node.parentElement);
    if (host && host.closest && host.closest("#la-popup,#la-bar,#la-selknop")) return null;
    var r = sel.getRangeAt(0).getBoundingClientRect();
    if (!r.width && !r.height) return null;
    return { tekst: tekst };
  }
  function openPopup(a) {
    /* alleen de popup sluiten, niet de zojuist vastgezette selectie opruimen */
    if (popup) { popup.remove(); popup = null; }
    popup = document.createElement("div"); popup.id = "la-popup";
    /* annotaties zonder bruikbaar anker openen gewoon in beeld */
    var pr = (a.rect && (a.rect.w || a.rect.h)) ? a.rect
      : { x: scrollX + 20, y: scrollY + 60, w: 0, h: 0 };
    popup.style.left = Math.max(8, Math.min(pr.x, document.documentElement.scrollWidth - 360)) + "px";
    popup.style.top = (pr.y + pr.h + 10) + "px";
    var icoDel = '<svg viewBox="0 0 14 14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" d="M2.5 3.5h9M5.5 3.5V2.5h3v1M4 3.5l.5 8h5l.5-8M6 5.5v4M8 5.5v4"/></svg>';
    var icoAtt = '<svg viewBox="0 0 14 14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" d="M8.6 3.8l-3.7 3.7a1.8 1.8 0 002.5 2.5l4-4a2.7 2.7 0 00-3.8-3.8L3.5 6.3a3.5 3.5 0 004.9 4.9l3.2-3.2"/></svg>';
    var icoLink = '<svg viewBox="0 0 14 14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" d="M5.8 8.2l2.4-2.4a2.2 2.2 0 013.1 3.1L8.9 10.3M8.2 5.8L5.8 8.2a2.2 2.2 0 01-3.1-3.1L4.7 2.7"/></svg>';
    var icoOk = '<svg viewBox="0 0 14 14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M3 7.2l2.8 2.8L11 4.2"/></svg>';
    popup.innerHTML =
      (a.type === "text" ? '<div class="la-quote"></div>' : "") +
      '<div class="la-ref-pick">Select text on the page to link it here</div>' +
      '<div class="la-comment-ed" contenteditable="true" data-placeholder="Write a comment\u2026 (link text with the chain icon)"></div>' +
      '<div class="la-imgwrap"></div>' +
      '<div class="la-rij">' +
      '<button class="la-del" title="Delete">' + icoDel + '</button>' +
      '<button class="la-attach" title="Attach image">' + icoAtt + '</button>' +
      '<button class="la-link" title="Link text from page">' + icoLink + '</button>' +
      '<button class="la-done" title="Mark as done (kept in history)">' + icoOk + '</button>' +
      '<span class="la-spacer"></span>' +
      '<button class="la-cancel">Cancel</button>' +
      '<button class="la-save">Save</button></div>' +
      '<div class="la-hint"></div>';
    document.body.appendChild(popup);
    if (a.type === "text") popup.querySelector(".la-quote").textContent = a.selectedText || "";
    var hint = popup.querySelector(".la-hint");
    if (!brug.ok) {
      hint.className = "la-hint la-waarschuwing";
      hint.textContent = "Bridge is off: localStorage only, nothing on disk yet.";
    } else if (a.refsIncomplete && a.refsIncomplete.length) {
      hint.className = "la-hint la-waarschuwing";
      hint.textContent = "Missing linked text for: " + a.refsIncomplete.join(", ") +
        ". Re-link or remove those chips before saving.";
    }
    var ed = popup.querySelector(".la-comment-ed");
    laCommentZet(ed, a.comment || "", a.refs || []);
    var refSeq = laRefTeller(a.refs);
    function volgendeRefId() { return "r" + (++refSeq); }
    var refPickEl = popup.querySelector(".la-ref-pick");
    var linkBtn = popup.querySelector(".la-link");
    function zetRefPick(aan) {
      refPickMode = aan;
      linkBtn.classList.toggle("la-aan", aan);
      refPickEl.classList.toggle("la-aan", aan);
    }
    refPickInsert = function (tekst) {
      laInsertAtRefCursor(ed, laMaakRefChip(volgendeRefId(), tekst));
      zetRefPick(false);
      try { window.getSelection().removeAllRanges(); } catch (e) {}
      ed.focus();
    };
    var wrap = popup.querySelector(".la-imgwrap");
    function toonImg() { wrap.innerHTML = a.img ? '<img class="la-img" src="' + a.img + '">' : ""; }
    toonImg();
    function bewaarRefCursor() { laRefCursorBewaar(ed); }
    ed.addEventListener("keyup", bewaarRefCursor);
    ed.addEventListener("mouseup", bewaarRefCursor);
    ed.addEventListener("input", bewaarRefCursor);
    refSelListener = function () {
      if (!popup || !ed) return;

        fr.readAsDataURL(items[i].getAsFile()); ev.preventDefault(); return;
      }

      ev.preventDefault();

    });

    });

      var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
      inp.onchange = function () {

      verwijder(a); sluitPopup();
    });
    popup.querySelector(".la-done").addEventListener("click", function () {
      markeerVerwerkt(a); sluitPopup();
    });
    popup.querySelector(".la-cancel").addEventListener("click", function () { render(); sluitPopup(); });
    function opslaan() {
      var parsed = laCommentLees(ed);
      var miss = laValideerRefs(parsed);
      if (miss.length) {
        hint.className = "la-hint la-waarschuwing";
        hint.textContent = "Link markers without text: " + miss.join(", ") +
          ". Use the chain icon to re-link, or delete the broken chips.";
        ed.focus();
        return;
      }
      a.comment = parsed.comment;
      a.refs = parsed.refs.length ? parsed.refs : null;
      bewaarAnnotatie(a); sluitPopup();

    /* Cmd+Enter (of Ctrl+Enter) slaat op, Escape annuleert (of stopt link-modus) */
    ed.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) {
        ev.preventDefault(); ev.stopPropagation(); opslaan();

  }

  /* ---- opslaan / verwijderen ------------------------------------- */
  function bewaarAnnotatie(a) {
    if (!anns.some(function (x) { return x.id === a.id; })) anns.push(a);
    bewaarLokaal(); render();
    return post("/save", Object.assign(basis(), {
      annotation: {
        id: a.id, type: a.type, rect: a.rect, comment: a.comment, target: a.target,
        selectedText: a.selectedText || null, refs: a.refs || null, img: a.img || null, createdAt: a.createdAt,
        /* bewerkingen op een conceptbericht; leeg voor de andere types */
        veld: a.veld || null, origineel: a.origineel || null, nieuw: a.nieuw || null,
        diff: a.diff || null, hunks: a.hunks || null
      }
    })).then(function (j) {
      brug.ok = true; brug.jsonPath = j.jsonPath; brug.count = j.count; brug.round = j.round;
      a.nr = j.nr; bewaarLokaal(); render();
      zetStatus(true, j.count + " saved", j.jsonPath);
      return j;
    }).catch(function (e) {
      brug.ok = false;
      zetStatus(false, "bridge off - localStorage only",
        "Start the bridge: python3 ~/.claude/skills/html-annotator/annotator-bridge.py");
      alert("The bridge is not running, so nothing was written to disk.\n" +
        "Your annotation is only in localStorage. Start the bridge with:\n" +
        "python3 ~/.claude/skills/html-annotator/annotator-bridge.py");
      throw e;
    });
  }

  function verwijder(a) {
    anns = anns.filter(function (x) { return x.id !== a.id; });
    bewaarLokaal(); render();
    return post("/delete", Object.assign(basis(), { id: a.id })).then(function (j) {
      brug.count = j.count;
      zetStatus(true, j.count + " saved", j.jsonPath);
    }).catch(function () { /* offline: localStorage is al bijgewerkt */ });
  }

  /* Verwerkt afvinken: nooit weggooien, alleen resolved zetten in de JSON. De
     annotatie verdwijnt van de pagina, de historie blijft op schijf staan. */
  function markeerVerwerkt(a) {
    if (!brug.ok) {
      alert("The bridge is not running, so check-off cannot be written.\n" +
        "Start it with: ~/.claude/skills/html-annotator/ensure-bridge.sh");
      return Promise.resolve(null);
    }
    return post("/resolve", Object.assign(basis(), { ids: [a.id], nrs: [a.nr] }))
      .then(function (j) {
        anns = anns.filter(function (x) { return x.id !== a.id; });
        bewaarLokaal(); render();
        brug.count = j.open;
        zetStatus(true, j.open + " saved", j.jsonPath);
        return j;
      }).catch(function (e) {
        alert("Check-off failed: " + (e && e.message ? e.message : e));
        throw e;
      });
  }

  /* ---- regio-selectie (snipping) --------------------------------- */
  var overlay = null, start = null, ghost = null;
  function tekstBij(rect) {
    var e = document.elementFromPoint(
      Math.max(0, Math.min(innerWidth - 2, rect.x + rect.w / 2 - scrollX)),
      Math.max(0, Math.min(innerHeight - 2, rect.y + 12 - scrollY)));
    var t = e ? (e.innerText || e.textContent || "") : "";
    return t.replace(/\s+/g, " ").trim().slice(0, 120);
  }
  function zetModus(aan) {
    document.getElementById("la-toggle").classList.toggle("la-aan", aan);
    if (!aan) { if (overlay) overlay.remove(); overlay = null; return; }
    overlay = document.createElement("div"); overlay.id = "la-overlay";
    document.body.appendChild(overlay);
    overlay.addEventListener("mousedown", function (ev) {
      start = { x: ev.pageX, y: ev.pageY };
      ghost = el("div"); ghost.className = "la-ghost";
    });
    overlay.addEventListener("mousemove", function (ev) {
      if (!start || !ghost) return;
      var x = Math.min(start.x, ev.pageX), y = Math.min(start.y, ev.pageY);
      ghost.style.left = x + "px"; ghost.style.top = y + "px";
      ghost.style.width = Math.abs(ev.pageX - start.x) + "px";
      ghost.style.height = Math.abs(ev.pageY - start.y) + "px";
    });
    overlay.addEventListener("mouseup", function (ev) {
      if (!start) return;
      var rect = {
        x: Math.round(Math.min(start.x, ev.pageX)), y: Math.round(Math.min(start.y, ev.pageY)),
        w: Math.round(Math.abs(ev.pageX - start.x)), h: Math.round(Math.abs(ev.pageY - start.y))
      };
      start = null;
      var g = ghost; ghost = null;
      zetModus(false);
      if (rect.w < 8 || rect.h < 8) { if (g) g.remove(); return; }
      /* de selectie blijft staan zolang de comment-popup open is */
      ruimGhostOp();
      if (g) { g.classList.add("la-ghost-vast"); hangendeGhost = g; }
      teller += 1;
      openPopup({
        id: Date.now() + "-" + teller, nr: teller, type: "region", rect: rect,
        target: tekstBij(rect), comment: "", img: null,
        createdAt: new Date().toISOString()
      });
    });
  }
  document.getElementById("la-toggle").addEventListener("click", function () { zetModus(!overlay); });

  /* ---- tekstselectie --------------------------------------------- */
  var selKnop = null;
  function verbergSelKnop() { if (selKnop) { selKnop.remove(); selKnop = null; } }
  function huidigeSelectie() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    var tekst = sel.toString().replace(/\s+/g, " ").trim();
    if (tekst.length < 2) return null;
    var node = sel.anchorNode;
    var host = node && (node.nodeType === 1 ? node : node.parentElement);
    if (host && host.closest && host.closest("#la-popup,#la-bar")) return null;
    var r = sel.getRangeAt(0).getBoundingClientRect();
    if (!r.width && !r.height) return null;
    return {
      tekst: tekst,
      rect: { x: Math.round(r.left + scrollX), y: Math.round(r.top + scrollY),
              w: Math.round(r.width), h: Math.round(r.height) }
    };
  }
  document.addEventListener("mouseup", function () {
    setTimeout(function () {
      if (refPickMode && popup && refPickInsert) {
        var s = paginaSelectie();
        if (s) refPickInsert(s.tekst);
        return;
      }
      if (overlay || popup) return;
      var s = huidigeSelectie();
      verbergSelKnop();
      if (!s) return;
      selKnop = document.createElement("button");
      selKnop.id = "la-selknop";
      selKnop.innerHTML = icoTekst + " Annotate selection";
      selKnop.style.left = s.rect.x + "px";
      selKnop.style.top = (s.rect.y + s.rect.h + 6) + "px";
      document.body.appendChild(selKnop);
      selKnop.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      selKnop.addEventListener("click", function (ev) {
        ev.stopPropagation(); verbergSelKnop();
        teller += 1;
        openPopup({
          id: Date.now() + "-" + teller, nr: teller, type: "text", rect: s.rect,
          selectedText: s.tekst, target: s.tekst.slice(0, 120), comment: "", img: null,
          createdAt: new Date().toISOString()
        });
      });
    }, 10);
  });
  document.addEventListener("scroll", verbergSelKnop, true);

  /* ---- tracked changes op conceptberichten ------------------------
     Een comment naast de tekst laat Luc uitleggen wat er anders moet; vaak is het
     sneller om het gewoon anders op te schrijven. Daarom is elke .la-draft-txt te
     bewerken, en wordt het verschil met de oorspronkelijke tekst zelf de annotatie:
     voor, na, en de losse wijzigingen. Zo hoeft er niets vertaald te worden van
     bedoeling naar tekst. */

  function laTokens(s) { return s.match(/\s+|\S+/g) || []; }

  /* Woord-diff via LCS. Woordniveau, niet teken- of regelniveau: bij lopende tekst
     leest dat als tracked changes in plaats van als ruis. */
  function laDiff(oud, nieuw) {
    var a = laTokens(oud), b = laTokens(nieuw), n = a.length, m = b.length;
    var uit = [];
    function duw(op, t) {
      var l = uit[uit.length - 1];
      if (l && l.op === op) { l.t += t; } else { uit.push({ op: op, t: t }); }
    }
    /* Bij extreem lange teksten is de matrix niet de moeite; dan is "alles vervangen"
       een eerlijker antwoord dan een bevroren tabblad. */
    if (n * m > 400000) {
      if (oud) duw("-", oud);
      if (nieuw) duw("+", nieuw);
      return uit;
    }
    var d = [], i, j;
    for (i = 0; i <= n; i++) { d.push(new Uint32Array(m + 1)); }
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        d[i][j] = a[i] === b[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
      }
    }
    i = 0; j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { duw("=", a[i]); i++; j++; }
      else if (d[i + 1][j] >= d[i][j + 1]) { duw("-", a[i]); i++; }
      else { duw("+", b[j]); j++; }
    }
    while (i < n) { duw("-", a[i++]); }
    while (j < m) { duw("+", b[j++]); }
    return uit;
  }

  /* Van een platte lijst wijzigingen naar hunks, zoals een unified diff dat doet.
     Elke aaneengesloten wijziging wordt een eigen blok met de tekst eromheen als anker.
     Waarom context en geen positie: een regel- of tekennummer klopt niet meer zodra er
     iets bóven de wijziging verandert, terwijl de omringende woorden een blok ook in een
     gewijzigd document nog terugvindbaar maken. Dat is precies waarom `patch` een hunk
     met een verschoven nummer alsnog plaatst.

     Het alineanummer is er om naar te kúnnen verwijzen ("alinea 3"), niet om op te
     zoeken. Verwar de twee niet: het anker is de tekst. */
  function laStaart(t, n) {
    if (t.length <= n) return t;
    var deel = t.slice(t.length - n);
    var sp = deel.search(/\S/);
    var w = deel.indexOf(" ");
    return w > 0 && w < 12 ? deel.slice(w + 1) : deel.slice(sp < 0 ? 0 : sp);
  }
  function laKop(t, n) {
    if (t.length <= n) return t;
    var deel = t.slice(0, n);
    var w = deel.lastIndexOf(" ");
    return w > n - 12 && w > 0 ? deel.slice(0, w) : deel;
  }
  function laAlinea(tekst, pos) {
    var voor = tekst.slice(0, Math.max(0, pos));
    return (voor.split(/\n\s*\n/).length);
  }

  function laHunks(ops, nieuweTekst) {
    var lijst = [], posNieuw = 0;
    ops.forEach(function (o) {
      lijst.push({ op: o.op, t: o.t, nieuw: posNieuw });
      if (o.op !== "-") posNieuw += o.t.length;
    });
    var hunks = [], i = 0, n = 0;
    while (i < lijst.length) {
      if (lijst[i].op === "=") { i++; continue; }
      var start = i, verwijderd = "", toegevoegd = "";
      while (i < lijst.length && lijst[i].op !== "=") {
        if (lijst[i].op === "-") { verwijderd += lijst[i].t; }
        else { toegevoegd += lijst[i].t; }
        i++;
      }
      n += 1;
      hunks.push({
        n: n,
        alinea: laAlinea(nieuweTekst, lijst[start].nieuw),
        voor: start > 0 ? laStaart(lijst[start - 1].t, 40) : "",
        na: i < lijst.length ? laKop(lijst[i].t, 40) : "",
        verwijderd: verwijderd,
        toegevoegd: toegevoegd
      });
    }
    return hunks;
  }

  function laTeken(box, ops) {
    box.textContent = "";
    var n = 0, vorigeWasWijziging = false;
    ops.forEach(function (o) {
      if (o.op === "=") {
        box.appendChild(document.createTextNode(o.t));
        vorigeWasWijziging = false;
        return;
      }
      if (!vorigeWasWijziging) {
        /* nummer vóór elk blok, zodat "hunk 2" in de chat hetzelfde blok aanwijst
           als het nummer op het scherm */
        n += 1;
        var sup = document.createElement("sup");
        sup.className = "la-hunk-nr";
        sup.textContent = n;
        box.appendChild(sup);
        vorigeWasWijziging = true;
      }
      var e = document.createElement(o.op === "+" ? "ins" : "del");
      e.textContent = o.t;
      box.appendChild(e);
    });
  }

  /* Naam van het concept, om een bewerking na een reload bij de goede kaart terug te
     vinden. De kop van de kaart is stabieler dan een index: kaarten worden verplaatst. */
  function laVeld(box, index) {
    var kaart = box.closest ? box.closest(".la-draft") : null;
    var kop = kaart && kaart.querySelector(".la-draft-hdr");
    var t = (kop && kop.textContent || "").replace(/\s+/g, " ").trim();
    return t ? t.slice(0, 160) : "concept-" + (index + 1);
  }

  /* Positie van een klik, uitgedrukt in tekens van de kale tekst: alles in een <del>
     telt niet mee, want dat staat er straks niet meer. */
  function laKlikOffset(box, x, y) {
    var r = null;
    if (document.caretRangeFromPoint) { r = document.caretRangeFromPoint(x, y); }
    else if (document.caretPositionFromPoint) {
      var cp = document.caretPositionFromPoint(x, y);
      if (cp) { r = document.createRange(); r.setStart(cp.offsetNode, cp.offset); }
    }
    if (!r || !box.contains(r.startContainer)) return null;
    var doel = r.startContainer, offset = r.startOffset, telling = 0, klaar = false;
    (function loop(node) {
      if (klaar) return;
      if (node.nodeType === 3) {
        if (node === doel) { telling += offset; klaar = true; return; }
        telling += node.nodeValue.length;
        return;
      }
      if (node.nodeName === "SUP" && node.className === "la-hunk-nr") {
        /* Het blokummer is opmaak, geen tekst: het staat niet in de echte tekst en mag
           dus niet meetellen, anders staat de cursor per voorafgaand blok één teken
           naast. Klikken óp het nummer telt als de rand van dat blok. */
        if (node.contains(doel)) { klaar = true; }
        return;
      }
      if (node.nodeName === "DEL") {
        /* geklikt ín een doorhaling: die tekst verdwijnt, dus de rand ervan is het
           dichtstbijzijnde punt dat straks nog bestaat */
        if (node.contains(doel)) { klaar = true; }
        return;
      }
      for (var i = 0; i < node.childNodes.length && !klaar; i++) { loop(node.childNodes[i]); }
    })(box);
    return Math.min(telling, box.__nieuw.length);
  }

  function laZetCaret(box, offset) {
    var t = box.firstChild;
    if (!t || t.nodeType !== 3) return;
    var r = document.createRange();
    r.setStart(t, Math.max(0, Math.min(offset, t.nodeValue.length)));
    r.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }

  function laDraftInit() {
    var boxen = document.querySelectorAll(".la-draft-txt");
    Array.prototype.forEach.call(boxen, function (box, index) {
      if (box.__laKlaar) return;
      box.__laKlaar = true;
      box.__origineel = box.textContent;
      box.__nieuw = box.textContent;
      box.__veld = laVeld(box, index);

      /* Altijd bewerkbaar. Een knop om "de bewerkmodus aan te zetten" is een drempel
         voor iets wat Luc gewoon wil kunnen doen: klikken waar hij wil en typen. */
      box.setAttribute("contenteditable", "plaintext-only");
      box.classList.add("la-bewerkbaar");

      var bar = document.createElement("div");
      bar.className = "la-draft-bar";
      var bHerstel = document.createElement("button");
      bHerstel.textContent = "↺ Restore original";
      bHerstel.style.display = "none";
      var meld = document.createElement("span");
      meld.className = "la-draft-meld";
      meld.textContent = "click the text to edit";
      bar.appendChild(bHerstel); bar.appendChild(meld);
      box.parentNode.insertBefore(bar, box.nextSibling);
      box.__bar = { herstel: bHerstel, meld: meld };

      /* De opgemaakte weergave (doorhaling + onderstreping) is alleen te zien als de
         cursor er niet in staat. Zodra Luc erin klikt gaat hij terug naar kale tekst,
         anders zou hij in zijn eigen doorhalingen zitten typen. */
      function toonMarkup() {
        if (box.__actief) return null;
        var ops = laDiff(box.__origineel, box.__nieuw);
        var gewijzigd = ops.some(function (o) { return o.op !== "="; });
        if (gewijzigd) { laTeken(box, ops); box.__markup = true; }
        else { box.textContent = box.__nieuw; box.__markup = false; }
        bHerstel.style.display = gewijzigd ? "" : "none";
        meld.textContent = gewijzigd
          ? (box.__nr ? "saved as annotation " + box.__nr : "edit not saved yet")
          : "click the text to edit";
        return ops;
      }
      box.__toonMarkup = toonMarkup;

      function toonPlat() {
        if (!box.__markup) return;
        box.textContent = box.__nieuw;
        box.__markup = false;
      }

      /* Klikken terwijl de opmaak zichtbaar is, is het lastige geval. De doorgehaalde
         tekst verdwijnt bij het terugschakelen naar kale tekst, dus de regel loopt anders
         en de cursor van de browser landt op de verkeerde plek. Daarom rekenen we de
         klikpositie zelf om: waar zat die klik in de kale tekst, de doorhalingen niet
         meegeteld — en dáár zetten we de cursor terug. */
      box.addEventListener("mousedown", function (ev) {
        if (!box.__markup) return;
        var doel = laKlikOffset(box, ev.clientX, ev.clientY);
        ev.preventDefault();
        box.__actief = true;
        toonPlat();
        box.focus();
        if (doel !== null) { laZetCaret(box, doel); }
      });
      box.addEventListener("focus", function () { box.__actief = true; toonPlat(); });

      function bewaarNu() {
        box.__nieuw = box.textContent;
        var ops = laDiff(box.__origineel, box.__nieuw);
        if (ops.some(function (o) { return o.op !== "="; })) { laBewaarBewerking(box, ops); }
        else if (box.__annId) { laVerwijderBewerking(box); }
        return ops;
      }
      box.__bewaarNu = bewaarNu;

      /* Tijdens het typen alleen opslaan, niet opmaken: de cursor mag niet verspringen. */
      var timer = null;
      box.addEventListener("input", function () {
        clearTimeout(timer);
        meld.textContent = "typing…";
        timer = setTimeout(function () { bewaarNu(); meld.textContent =
          box.__nr ? "saved as annotation " + box.__nr : "saved"; }, 900);
      });

      box.addEventListener("blur", function () {
        clearTimeout(timer);
        box.__actief = false;
        bewaarNu();
        toonMarkup();
      });

      box.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") { ev.preventDefault(); box.blur(); }
      });

      bHerstel.addEventListener("click", function () {
        box.__nieuw = box.__origineel;
        box.__markup = false;
        box.textContent = box.__origineel;
        laVerwijderBewerking(box);
        bHerstel.style.display = "none";
        meld.textContent = "original restored";
      });
    });
  }

  function laVerwijderBewerking(box) {
    if (!box.__annId) return;
    var a = anns.filter(function (x) { return x.id === box.__annId; })[0];
    if (a) { verwijder(a); }
    box.__annId = null; box.__nr = null;
  }

  function laBewaarBewerking(box, ops) {
    var a = {
      id: box.__annId || ("edit-" + Date.now() + "-" + Math.random().toString(16).slice(2, 6)),
      type: "edit",
      veld: box.__veld,
      target: box.__veld,
      origineel: box.__origineel,
      nieuw: box.__nieuw,
      diff: ops,
      hunks: laHunks(ops, box.__nieuw),
      comment: "Tekst herschreven in het concept",
      rect: { x: 0, y: 0, w: 0, h: 0 }
    };
    var bestaand = box.__annId && anns.filter(function (x) { return x.id === box.__annId; })[0];
    if (bestaand) {
      Object.keys(a).forEach(function (k) { bestaand[k] = a[k]; });
      a = bestaand;
    } else {
      teller += 1; a.nr = teller; a.createdAt = new Date().toISOString();
      anns.push(a);
    }
    box.__annId = a.id;
    return bewaarAnnotatie(a).then(function () {
      box.__nr = a.nr;
      box.__bar.meld.textContent = "saved as annotation " + a.nr;
      return a;
    }).catch(function () {
      box.__bar.meld.textContent = "not saved — bridge unreachable";
    });
  }

  /* Een blok terugplaatsen in de huidige tekst, op zijn anker. Dezelfde drie pogingen
     van streng naar soepel als pas-hunk-toe.py: volledige context, linkercontext, kaal —
     en alleen als de treffer uniek is, want anders zou hij op de verkeerde plek landen. */
  function laPlaatsHunk(tekst, h) {
    var voor = h.voor || "", na = h.na || "";
    var weg = h.verwijderd || "", erbij = h.toegevoegd || "";
    var pogingen = [[voor + weg + na, voor + erbij + na], [voor + weg, voor + erbij]];
    if (weg) { pogingen.push([weg, erbij]); }
    for (var i = 0; i < pogingen.length; i++) {
      var zoek = pogingen[i][0], vervang = pogingen[i][1];
      if (!zoek) continue;
      var eerste = tekst.indexOf(zoek);
      if (eerste >= 0 && tekst.indexOf(zoek, eerste + 1) < 0) {
        return tekst.slice(0, eerste) + vervang + tekst.slice(eerste + zoek.length);
      }
    }
    return null;
  }

  /* Na een reload staan de bewerkingen op schijf maar toont de kaart weer de tekst zoals
     hij nu is. Openstaande blokken worden daar één voor één op teruggeplaatst — niet de
     opgeslagen eindtekst in één keer. Dat verschil telt zodra een agent één blok heeft
     doorgevoerd: de pagina is dan veranderd, en alleen wat nog openstaat hoort nog te
     worden getoond. Blokken die al verwerkt zijn verdwijnen vanzelf. */
  function laHerstelBewerkingen() {
    var perVeld = {};
    anns.forEach(function (a) { if (a.type === "edit" && a.veld) { perVeld[a.veld] = a; } });
    Array.prototype.forEach.call(document.querySelectorAll(".la-draft-txt"), function (box) {
      var a = perVeld[box.__veld];
      if (!a || !box.__toonMarkup) return;
      var hunks = (a.hunks || []).filter(function (h) { return !h.resolved; });

      if (!hunks.length) {
        /* Oudere bewerking zonder blokken: alleen terugzetten als de tekst nog exact
           is zoals hij was, anders zou Lucs oude versie over de nieuwe heen komen. */
        if (a.origineel && a.origineel !== box.__origineel) {
          box.__bar.meld.textContent = "note: draft text changed since annotation " + a.nr;
          return;
        }
        box.__annId = a.id; box.__nr = a.nr; box.__nieuw = a.nieuw || box.__origineel;
        box.__toonMarkup();
        return;
      }

      var tekst = box.__origineel, geplaatst = 0, kwijt = [];
      hunks.forEach(function (h) {
        var r = laPlaatsHunk(tekst, h);
        if (r === null) { kwijt.push(h.n); } else { tekst = r; geplaatst += 1; }
      });
      if (!geplaatst) {
        box.__bar.meld.textContent =
          "annotation " + a.nr + ": text changed too much to show the edit";
        return;
      }
      box.__annId = a.id; box.__nr = a.nr; box.__nieuw = tekst;
      box.__toonMarkup();
      if (kwijt.length) {
        box.__bar.meld.textContent = "annotation " + a.nr + ": hunk " + kwijt.join(", ") +
          " no longer found in the text";
      }
    });
  }

  /* ---- test/debug-API -------------------------------------------- */
  window.LucAnnotator = {
    anns: function () { return anns; },
    bridge: function () { return brug; },
    session: verversSessie,
    save: bewaarAnnotatie,
    remove: verwijder,
    resolve: markeerVerwerkt,
    drafts: function () {
      return Array.prototype.map.call(document.querySelectorAll(".la-draft-txt"), function (b) {
        return { veld: b.__veld, origineel: b.__origineel, nieuw: b.__nieuw, nr: b.__nr || null };
      });
    },
    diff: laDiff,
    add: function (a) {
      teller += 1;
      a.nr = teller; a.type = a.type || (a.selectedText ? "text" : "region");
      a.id = a.id || Date.now() + "-" + teller;
      a.createdAt = a.createdAt || new Date().toISOString();
      if (!a.rect) a.rect = { x: 0, y: 0, w: 0, h: 0 };
      return bewaarAnnotatie(a);
    }
  };
  /* ---- knoppen naar een nieuwe Claude-sessie ---------------------- */
  /* Een ingebedde browser (zoals de preview-pane) geeft custom schemes als
     claude:// niet door aan het OS: de klik doet dan stilzwijgend niets.
     We proberen te navigeren en merken aan het uitblijven van een blur dat het
     mislukt is; dan kopiëren we de link, zodat Luc hem kan plakken. */
  function meldSessie(tekst, fout) {
    var m = document.getElementById("la-sesmeld") || el("div");
    m.id = "la-sesmeld";
    m.className = fout ? "la-sesmeld la-fout" : "la-sesmeld";
    m.textContent = tekst;
    clearTimeout(m._t);
    m._t = setTimeout(function () { if (m.parentNode) m.remove(); }, 7000);
  }
  function naarKlembord(url) {
    var klaar = function () {
      meldSessie("This view cannot open Claude links. The link is on your clipboard — paste it in Spotlight (⌘Space).", true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(klaar, function () {
        meldSessie("Could not open the session. Start the bridge, or open this page in your own browser.", true);
      });
      return;
    }
    var t = document.createElement("textarea");
    t.value = url; t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); klaar(); } catch (e) {
      meldSessie("Could not open the session. Start the bridge, or open this page in your own browser.", true);
    }
    t.remove();
  }

  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a.la-sessie");
    if (!a) return;
    ev.preventDefault();
    var url = a.getAttribute("href") || "";
    /* Eerst de bridge: die draait buiten de browser en kan het scheme wel
       openen. Lukt dat niet, dan pas navigeren en anders het klembord. */
    post("/sessie", { url: url }).then(function () {
      meldSessie("Opened a new Claude session.");
    }).catch(function () {
      var vertrokken = false;
      function weg() { vertrokken = true; }
      window.addEventListener("blur", weg, { once: true });
      document.addEventListener("visibilitychange", weg, { once: true });
      try { window.location.href = url; } catch (e) { /* geblokkeerd */ }
      setTimeout(function () {
        window.removeEventListener("blur", weg);
        if (!vertrokken) naarKlembord(url);
      }, 700);
    });
  }, true);

  render();
  laDraftInit();
  verversSessie().then(function () { laHerstelBewerkingen(); });
  /* De bridge komt vaak later omhoog dan de pagina: de hook start hem pas ná de
     schrijf-actie, en soms start iemand hem met de hand. Zonder deze poller blijft een
     al openstaande pagina tot een reload op "bridge uit" staan, ook als de bridge
     inmiddels antwoordt. Eén boolean-check per 3 seconden, alleen bij een zichtbare
     pagina; zodra de bridge er is doet hij niets meer, en valt hij later weg dan pakt
     dezelfde timer het weer op. */
  setInterval(function () {
    if (!brug.ok && !document.hidden) verversSessie();
  }, 3000);
  document.addEventListener("visibilitychange", function () {
    if (!brug.ok && !document.hidden) verversSessie();
  });
  window.addEventListener("focus", function () {
    if (!brug.ok) verversSessie();
  });
})();
</script>
