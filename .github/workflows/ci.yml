name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  bridge:
    name: bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests
        run: |
          python -m compileall -q html_annotator bin
          python tests/test_record.py
          python tests/test_bridge_contract.py
          python tests/test_toon.py
          python tests/test_layout.py

      - name: Start bridge (detached, via the CLI)
        run: |
          python -m html_annotator ensure
          python -m html_annotator ensure | grep -q "already running"
          python -m html_annotator status | grep -q '"ok": true'

      - name: Real /save with a snippet page
        run: |
          # page under home, served same-origin via /p/ with forward slashes
          {
            echo '<!doctype html><meta charset="utf-8"><title>CI: page?*</title>'
            echo '<h1 id="kop">CI smoke</h1><p>tekst met ünïcode</p>'
            cat references/annotator-snippet.html
          } > "$HOME/ci-page.html"
          python -m html_annotator url "$HOME/ci-page.html" | grep -q '/p/ci-page.html'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8791/p/ci-page.html | grep -q 200
          # outside home must be refused
          curl -s --path-as-is -o /dev/null -w '%{http_code}\n' 'http://127.0.0.1:8791/p/../../etc/passwd' | grep -q 403
          curl -fsS -X POST http://127.0.0.1:8791/save -H 'Content-Type: application/json' -d '{
            "page": "http://127.0.0.1:8791/p/ci-page.html",
            "pageFile": "~/ci-page.html",
            "doc": {"w": 800, "h": 600},
            "annotation": {"id": "ci-1", "type": "text", "selectedText": "CI smoke", "comment": "ünïcode ok"}
          }' | tee save.json
          grep -q '"ok": true' save.json
          # region annotation: crop may fail (no display), the record must still land
          curl -fsS -X POST http://127.0.0.1:8791/save -H 'Content-Type: application/json' -d '{
            "page": "http://127.0.0.1:8791/p/ci-page.html",
            "pageFile": "~/ci-page.html",
            "doc": {"w": 800, "h": 600},
            "annotation": {"id": "ci-2", "type": "region", "rect": {"x": 10, "y": 10, "w": 100, "h": 40}, "comment": "regio"}
          }' | grep -q '"ok": true'
          # slug from title must be filesystem-safe on every OS
          curl -fsS -X POST http://127.0.0.1:8791/save -H 'Content-Type: application/json' -d '{
            "page": "http://127.0.0.1:8791/other",
            "title": "CI: page?*<>|",
            "annotation": {"id": "ci-3", "type": "text", "selectedText": "x", "comment": "slug"}
          }' | grep -q '"ok": true'

      - name: annotations.json on disk
        run: |
          python - <<'PY'
          import glob, json, os
          root = os.path.expanduser("~/annotations")
          hits = glob.glob(os.path.join(root, "*", "ronde-*", "annotations.json"))
          print("\n".join(hits))
          assert len(hits) == 2, hits
          for h in hits:
              slug = os.path.basename(os.path.dirname(os.path.dirname(h)))
              assert not set(slug) & set(':*?"<>|'), slug
          d = json.load(open(os.path.join(root, "ci-page", "ronde-01", "annotations.json"), encoding="utf-8"))
          ann = {a["id"]: a for a in d["annotations"]}
          assert ann["ci-1"]["comment"] == "ünïcode ok", ann["ci-1"]
          assert "ci-2" in ann and (ann["ci-2"].get("image") or ann["ci-2"].get("imageError")), ann["ci-2"]
          print("crop:", ann["ci-2"].get("image"), ann["ci-2"].get("imageError"))
          assert os.path.isdir(os.path.join(root, "ci-page")), os.listdir(root)
          print("OK")
          PY

  playwright:
    name: playwright suite (ubuntu, best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install playwright-core
        run: cd tests && npm i --no-save playwright-core
      - name: Run suite
        run: tests/run.sh 00 09 11 02 06 08 12 14 15 16 17

      - name: Stop bridge
        if: always()
        run: python -m html_annotator stop || true
